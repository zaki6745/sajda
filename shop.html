<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="shop.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header>
        <img src="logo.png" alt="logo" class="logo">
        <h4>welcome in our brand</h4>
        <nav class="nav-links">
            <a href="index.html">
                <i class="fa-solid fa-house my-icon"></i>
            </a>
            <a href="cart.html" class="cart-link">
                <i class="fa-solid fa-cart-shopping my-icon"></i>
            </a>
        </nav>
    </header>



<div class="product-card">
<h2>Sajda Hoodie</h2>
  <img id="product-img" src="hoodie-black-1.png">

   <div class="thumbnails" id="thumbnails"></div>


  <p class="price">2300 DA</p>

  <!-- COLORS -->
  <p>Color</p>
  <div class="colors">
    <button class="color-btn black active" onclick="selectColor('black')"></button>
    <button class="color-btn white" onclick="selectColor('white')"></button>
    <button class="color-btn grey" onclick="selectColor('grey')"></button>
  </div>

  <!-- SIZES -->
  <p>Size</p>
  <div class="sizes">
    <button class="size-btn" onclick="selectSize(this,'S')">S</button>
    <button class="size-btn" onclick="selectSize(this,'M')">M</button>
    <button class="size-btn" onclick="selectSize(this,'L')">L</button>
  </div>

  <!-- QUANTITY -->
  <p>Quantity</p>
  <input type="number" id="qty" value="1" min="1">

  <button class="add-btn" onclick="addToCart()">Add to Cart</button>



</div>






<script>
let selectedColor = "black";
let selectedSize = null;

const productImages = {
  black: [
    "hoodie-black-1.png",
    "hoodie-black-2.png",
    "hoodie-black-3.png"
  ],
  white: [
    "hoodie-white-1.png",
    "hoodie-white-2.png",
    "hoodie-white-3.png"
  ],
  grey: [
    "hoodie-grey-1.png",
    "hoodie-grey-2.png",
    "hoodie-grey-3.png"
  ]
};

function loadThumbnails(color) {
  const container = document.getElementById("thumbnails");
  container.innerHTML = "";

  productImages[color].forEach((imgSrc, index) => {
    let img = document.createElement("img");
    img.src = imgSrc;
    img.classList.add("thumb");
    img.onclick = () => {
      document.getElementById("product-img").src = imgSrc;
    };
    container.appendChild(img);
  });

  // set first image as main
  document.getElementById("product-img").src = productImages[color][0];
}

function selectColor(color) {
  selectedColor = color;

  document.querySelectorAll(".color-btn")
    .forEach(btn => btn.classList.remove("active"));

  document.querySelector(".color-btn." + color).classList.add("active");

  loadThumbnails(color);
}

function selectSize(btn, size) {
  selectedSize = size;

  document.querySelectorAll(".size-btn")
    .forEach(b => b.classList.remove("active"));

  btn.classList.add("active");
}

function addToCart() {
  if (!selectedSize) {
    alert("Please select size");
    return;
  }

  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  let qty = document.getElementById("qty").value;

  cart.push({
    name: "Sajda Hoodie",
    price: 2300,
    color: selectedColor,
    size: selectedSize,
    qty: qty
  });

  localStorage.setItem("cart", JSON.stringify(cart));
  alert("Added to cart ✅");
}

// Load default color on page open
loadThumbnails("black");
</script>


</body>
</html>
